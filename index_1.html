<style>
:root{
  --ground:#0b1214;
  --surface:#121b1e;
  --raised:#172327;
  --edge:#1e2b2f;
  --bone:#e8e2d5;
  --dim:#6e7f83;
  --dimmer:#485a5e;
  --brass:#c9a24e;
  --brass-soft:rgba(201,162,78,.14);
  --oxide:#b5563f;
  --r:12px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--ground);
  color:var(--bone);
  font-family:Archivo,"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.4;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
#app{
  min-height:100%;
  display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 104px);
  max-width:560px;margin:0 auto;
}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:22px}
.mark{
  font-size:19px;font-weight:600;letter-spacing:-.02em;
  display:flex;align-items:center;gap:8px;
}
.mark svg{width:17px;height:17px;color:var(--brass);flex:none}
.readout{
  font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;letter-spacing:.04em;color:var(--dim);
  text-align:right;font-variant-numeric:tabular-nums;
}
.readout b{color:var(--brass);font-weight:500}

/* ---------- sections ---------- */
main{display:flex;flex-direction:column;gap:8px;flex:1}
.seclabel{
  font-family:"DM Mono",ui-monospace,monospace;
  font-size:10px;text-transform:uppercase;letter-spacing:.16em;
  color:var(--dimmer);margin:14px 2px 2px;
}
.group{background:var(--surface);border:1px solid var(--edge);border-radius:var(--r);overflow:hidden}
.group.open{background:var(--raised);border-color:#2a3b40}
.group.empty .grow{opacity:.42}
.grow{
  width:100%;display:flex;align-items:center;gap:12px;
  padding:15px 15px;text-align:left;min-height:54px;
}
.gicon{width:19px;height:19px;flex:none;color:var(--dim);display:block}
.group.open .gicon{color:var(--brass)}
.gicon svg{width:100%;height:100%;display:block}
.gname{flex:1;font-size:15px;font-weight:500;letter-spacing:-.01em}
.gcount{
  font-family:"DM Mono",ui-monospace,monospace;font-size:13px;
  color:var(--dim);font-variant-numeric:tabular-nums;
}
.gcount.clear{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer)}
.gcount.hot{color:var(--brass)}
.ghint{
  font-family:"DM Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);
  padding:0 15px 12px;margin-top:-4px;
}
.gtasks{display:flex;flex-direction:column;padding:0 8px 8px}

/* ---------- task ---------- */
.task{position:relative;border-radius:9px;overflow:hidden;background:var(--ground)}
.task + .task{margin-top:6px}
.trow{position:relative;overflow:hidden}
.behind{
  position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;
  justify-content:space-between;padding:0 16px;
  font-family:"DM Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;
  background:var(--brass-soft);color:var(--brass);
}
.behind .kill{color:var(--oxide)}
.tsurface{
  position:relative;background:var(--surface);
  padding:13px 14px;display:flex;align-items:flex-start;gap:10px;
  touch-action:pan-y;user-select:none;
  transition:transform .22s cubic-bezier(.2,.8,.3,1);
}
.task.sliding .tsurface{transition:none}
.tsurface .tg{width:14px;height:14px;color:var(--dimmer);flex:none;margin-top:3px}
.tsurface .tg svg{width:100%;height:100%;display:block}
.ttitle{flex:1;font-size:15px;line-height:1.35;letter-spacing:-.005em;word-break:break-word}
.tmeta{
  font-family:"DM Mono",ui-monospace,monospace;font-size:10px;
  color:var(--dimmer);flex:none;margin-top:3px;font-variant-numeric:tabular-nums;
}
.tmeta.due{color:var(--brass)}
.tmeta.late{color:var(--oxide)}
.task.done .tsurface{background:var(--brass-soft)}
.task.done .ttitle{color:var(--brass);text-decoration:line-through;text-decoration-color:rgba(201,162,78,.5)}

/* rot + nudge */
.rot{
  position:relative;z-index:1;
  display:flex;align-items:center;gap:10px;padding:9px 14px 11px;
  background:var(--surface);border-top:1px dashed var(--edge);
  font-family:"DM Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
}
.rot span{flex:1}
.rot button{
  font-family:inherit;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  padding:5px 10px;border:1px solid var(--edge);border-radius:6px;color:var(--bone);
}
.rot button.no{color:var(--oxide);border-color:rgba(181,86,63,.35)}

/* tray */
.ttray{position:relative;z-index:1;display:none;gap:6px;padding:8px 10px 10px;background:var(--surface);flex-wrap:wrap;border-top:1px solid var(--edge)}
.task.tray .ttray{display:flex}
.chip{
  font-family:"DM Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.08em;text-transform:uppercase;
  padding:6px 9px;border:1px solid var(--edge);border-radius:6px;color:var(--dim);
}
.chip.on{border-color:var(--brass);color:var(--brass)}
.chip.del{margin-left:auto;color:var(--oxide);border-color:rgba(181,86,63,.3)}

/* ---------- empty ---------- */
.empty-all{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:var(--dimmer);text-align:center;padding:60px 0;
}
.empty-all svg{width:34px;height:34px;color:var(--brass);opacity:.65}
.empty-all p{margin:0;font-size:14px}
.empty-all .sub{
  font-family:"DM Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);
}

/* ---------- capture ---------- */
#capture{
  position:fixed;left:0;right:0;bottom:0;
  padding:12px 18px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(to top,var(--ground) 62%,rgba(11,18,20,0));
  display:flex;justify-content:center;
}
.bar{
  width:100%;max-width:524px;display:flex;align-items:center;gap:8px;
  background:var(--raised);border:1px solid var(--edge);border-radius:26px;
  padding:6px 6px 6px 18px;
}
#entry{
  flex:1;background:none;border:0;outline:none;font-size:16px;padding:11px 0;
  letter-spacing:-.005em;
}
#entry::placeholder{color:var(--dimmer)}
#add{
  width:38px;height:38px;flex:none;border-radius:50%;
  background:var(--brass-soft);color:var(--brass);
  display:grid;place-items:center;transition:background .15s,transform .15s;
}
#add svg{width:17px;height:17px}
#add:active{transform:scale(.92)}
#add.ready{background:var(--brass);color:var(--ground)}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(8px);
  bottom:calc(env(safe-area-inset-bottom) + 78px);
  font-family:"DM Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--brass);
  background:var(--raised);border:1px solid var(--edge);
  padding:7px 13px;border-radius:20px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- footer ---------- */
.tools{
  display:flex;gap:14px;justify-content:center;margin-top:26px;
  font-family:"DM Mono",ui-monospace,monospace;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;
}
.tools button{color:var(--dimmer)}
.tools button:active{color:var(--dim)}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5 9.5 18 20 6"/></svg>
      Handled
    </div>
    <div class="readout" id="readout"></div>
  </header>
  <main id="list"></main>
  <div class="tools">
    <button type="button" id="export">Copy backup</button>
    <button type="button" id="import">Restore</button>
  </div>
</div>

<form id="capture" autocomplete="off">
  <div class="bar">
    <input id="entry" placeholder="What needs doing?" enterkeyhint="done" autocapitalize="sentences" autocorrect="off" spellcheck="false">
    <button id="add" type="submit" aria-label="Add">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
</form>
<div id="toast" role="status"></div>

<script>
"use strict";

/* ---------------- icons ---------------- */
var P = {
  quick:'M13 2 4.5 14H11l-1 8 8.5-12H12z',
  screen:'M3 5h18v11H3zM9 20h6M12 16v4',
  phone:'M6.6 3h2.9l1.5 4-2 1.4a12.3 12.3 0 0 0 5.6 5.6L16 12l4 1.5v2.9a2 2 0 0 1-2.2 2A16.6 16.6 0 0 1 4.6 5.2 2 2 0 0 1 6.6 3z',
  out:'M12 21.5s7-6.4 7-11.2A7 7 0 1 0 5 10.3c0 4.8 7 11.2 7 11.2zM12 12.6a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z',
  waiting:'M7 3h10M7 21h10M17 3v3.6L12 12l5 5.4V21M7 3v3.6L12 12l-5 5.4V21',
  dated:'M4 6h16v15H4zM4 11h16M8 3.5v4M16 3.5v4'
};
function svg(k, w){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="'+(w||1.6)+
    '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+P[k]+'"/></svg>';
}

/* ---------------- groups ---------------- */
var GROUPS = [
  {id:'quick',   name:'Two minutes',       short:'2 min',    hint:'knock these out where you stand'},
  {id:'screen',  name:'At a computer',     short:'computer', hint:'waiting for a keyboard'},
  {id:'phone',   name:'Phone or text',     short:'phone',    hint:'someone to reach'},
  {id:'out',     name:'Out in the world',  short:'out',      hint:'requires legs'},
  {id:'waiting', name:'Waiting on someone',short:'waiting',  hint:'not your move'}
];
var GMAP = {}; GROUPS.forEach(function(g){ GMAP[g.id] = g; });

/* Order matters: first match wins. */
var RULES = [
  ['waiting', /\b(waiting|wait(ing)? (on|for|to hear)|heard back|pending|blocked on|they owe|owes me)\b/],
  ['quick',   /\b(text|reply|respond|rsvp|venmo|zelle|confirm|accept|decline|unsubscribe|tip|quick|2 ?min|2m)\b/],
  ['phone',   /\b(call|ring|phone|voicemail|dial|leave a message)\b/],
  ['out',     /\b(return|pick ?up|drop ?off|mail|ship|print|go to|stop by|swing by|visit|grab|store|pharmacy|cvs|walgreens|bank|post office|laundry|dry clean|haircut|barber|gym|target|trader joe|groceries|errand)\b/],
  ['screen',  /\b(sign ?up|order|book|research|look ?up|find|search|apply|register|download|upload|submit|renew|cancel|fill out|form|email|watch|read|compare|set ?up|update|log ?in|website|online|google|check)\b/]
];

function classify(text){
  var t = text.toLowerCase();
  var first = (t.match(/[a-z']+/) || [''])[0];
  if (S.overrides[first]) return S.overrides[first];
  for (var i=0;i<RULES.length;i++){ if (RULES[i][1].test(t)) return RULES[i][0]; }
  return 'screen';
}

/* ---------------- dates ---------------- */
var DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
function dayKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function shiftDays(n){ var d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+n); return dayKey(d); }

function parseDate(text){
  var t = ' ' + text.toLowerCase() + ' ';
  var due = null, cut = null, m;

  if ((m = t.match(/\b(today|tonight|tonite)\b/)))        { due = shiftDays(0); cut = m[0]; }
  else if ((m = t.match(/\b(tomorrow|tmrw|tmw)\b/)))       { due = shiftDays(1); cut = m[0]; }
  else if ((m = t.match(/\bin (\d{1,2}) days?\b/)))        { due = shiftDays(+m[1]); cut = m[0]; }
  else if ((m = t.match(/\bnext week\b/)))                 { due = shiftDays(7); cut = m[0]; }
  else if ((m = t.match(/\b(?:next |this |by |on )?(sun|mon|tues?|wed(?:nes)?|thur?s?|fri|sat)(?:day)?\b/))){
    var stem = m[1];
    var idx = DAYS.findIndex(function(d){ return d.indexOf(stem.replace(/s$/,'')) === 0 || stem.indexOf(d.slice(0,3)) === 0; });
    if (idx > -1){
      var now = new Date(); now.setHours(12,0,0,0);
      var delta = (idx - now.getDay() + 7) % 7;
      if (delta === 0) delta = 7;
      if (/next /.test(m[0]) && delta < 7) delta += 0;
      due = shiftDays(delta); cut = m[0];
    }
  }
  else if ((m = t.match(/\b(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?\b/))){
    var yr = m[3] ? (m[3].length === 2 ? 2000 + (+m[3]) : +m[3]) : new Date().getFullYear();
    var d2 = new Date(yr, (+m[1]) - 1, +m[2], 12, 0, 0, 0);
    if (!m[3] && d2 < new Date(new Date().setHours(0,0,0,0))) d2.setFullYear(yr + 1);
    if (!isNaN(d2)) { due = dayKey(d2); cut = m[0]; }
  }

  var title = text;
  if (cut){
    var re = new RegExp('\\s*\\b' + cut.trim().replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&') + '\\b\\s*', 'i');
    title = text.replace(re, ' ').replace(/\s{2,}/g,' ').replace(/\s+([,.!?])/g,'$1').trim();
    title = title.replace(/\s+(by|on|due)$/i,'').trim();
  }
  return { due: due, title: title || text.trim() };
}

function dueLabel(due){
  var today = shiftDays(0);
  if (due === today) return 'today';
  if (due === shiftDays(1)) return 'tmrw';
  var a = new Date(due + 'T12:00:00'), b = new Date(today + 'T12:00:00');
  var diff = Math.round((a - b) / 86400000);
  if (diff < 0) return diff === -1 ? '1d late' : (-diff) + 'd late';
  if (diff < 7) return DAYS[a.getDay()].slice(0,3);
  return (a.getMonth()+1) + '/' + a.getDate();
}

/* ---------------- state ---------------- */
var KEY = 'handled.v1';
var S = { tasks:[], overrides:{}, doneToday:0, doneDate:'', streak:0, lastDone:'', open:null };

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      Object.keys(S).forEach(function(k){ if (p[k] !== undefined) S[k] = p[k]; });
    }
  }catch(e){}
  if (S.doneDate !== shiftDays(0)) { S.doneToday = 0; S.doneDate = shiftDays(0); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

var uid = function(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); };
var DAY = 86400000;
var age = function(ts){ return Math.floor((Date.now() - ts) / DAY); };

/* ---------------- actions ---------------- */
function add(raw){
  var text = raw.trim();
  if (!text) return null;
  var d = parseDate(text);
  var g = classify(d.title);
  S.tasks.unshift({ id: uid(), title: d.title, group: g, due: d.due, created: Date.now(), touched: Date.now() });
  save();
  return g;
}
function find(id){ return S.tasks.filter(function(t){ return t.id === id; })[0]; }

function complete(id){
  var t = find(id); if (!t) return;
  var today = shiftDays(0);
  if (S.doneDate !== today) { S.doneDate = today; S.doneToday = 0; }
  S.doneToday++;
  if (S.lastDone !== today){
    S.streak = (S.lastDone === shiftDays(-1)) ? S.streak + 1 : 1;
    S.lastDone = today;
  }
  var el = document.querySelector('.task[data-id="'+id+'"]');
  if (el) el.classList.add('done');
  save(); paintReadout();
  setTimeout(function(){
    S.tasks = S.tasks.filter(function(x){ return x.id !== id; });
    save(); render();
  }, 340);
}
function remove(id){ S.tasks = S.tasks.filter(function(t){ return t.id !== id; }); save(); render(); }
function keep(id){ var t = find(id); if (t){ t.touched = Date.now(); save(); render(); } }
function move(id, g){
  var t = find(id); if (!t) return;
  t.group = g; t.touched = Date.now();
  var first = (t.title.toLowerCase().match(/[a-z']+/) || [''])[0];
  if (first) S.overrides[first] = g;
  save(); render();
  toast('learned: ' + first + ' -> ' + GMAP[g].short);
}

/* ---------------- render ---------------- */
var listEl = document.getElementById('list');
var readEl = document.getElementById('readout');

function paintReadout(){
  var n = S.doneToday, s = S.streak;
  var bits = [];
  if (n > 0) bits.push('<b>' + n + '</b> done today');
  if (s > 1) bits.push('<b>' + s + '</b> day streak');
  if (!bits.length) bits.push(new Date().toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}).toLowerCase());
  readEl.innerHTML = bits.join(' &middot; ');
}

function esc(s){ return s.replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

function taskHTML(t, showGroupIcon){
  var meta = '', cls = '';
  if (t.due){
    var lab = dueLabel(t.due);
    cls = /late/.test(lab) ? 'late' : 'due';
    meta = '<span class="tmeta '+cls+'">'+lab+'</span>';
  } else if (t.group === 'waiting' && age(t.created) >= 10){
    meta = '<span class="tmeta late">nudge?</span>';
  }
  var rot = '';
  if (!t.due && age(t.touched) >= 14){
    rot = '<div class="rot"><span>sat here '+age(t.touched)+' days</span>'+
          '<button type="button" data-keep="'+t.id+'">still real</button>'+
          '<button type="button" class="no" data-kill="'+t.id+'">drop it</button></div>';
  }
  var chips = GROUPS.map(function(g){
    return '<button type="button" class="chip'+(g.id===t.group?' on':'')+'" data-move="'+t.id+'" data-g="'+g.id+'">'+g.short+'</button>';
  }).join('') + '<button type="button" class="chip del" data-kill="'+t.id+'">delete</button>';

  return '<div class="task" data-id="'+t.id+'">'+
    '<div class="trow">'+
      '<div class="behind"><span>done</span><span class="kill">edit</span></div>'+
      '<div class="tsurface">'+
        (showGroupIcon ? '<span class="tg">'+svg(t.group,1.7)+'</span>' : '')+
        '<span class="ttitle">'+esc(t.title)+'</span>'+ meta +
      '</div>'+
    '</div>'+ rot +
    '<div class="ttray">'+chips+'</div>'+
  '</div>';
}

function render(){
  paintReadout();
  var html = '';
  var dated = S.tasks.filter(function(t){ return t.due; })
                     .sort(function(a,b){ return a.due < b.due ? -1 : 1; });
  var undated = S.tasks.filter(function(t){ return !t.due; });

  if (!S.tasks.length){
    listEl.innerHTML = '<div class="empty-all">'+svg('quick',1.4)+
      '<p>Nothing on the list.</p><p class="sub">enjoy it</p></div>';
    return;
  }

  if (dated.length){
    html += '<div class="seclabel">On a date</div>';
    html += '<div class="group open"><div class="gtasks" style="padding-top:8px">'+
            dated.map(function(t){ return taskHTML(t, true); }).join('')+'</div></div>';
    html += '<div class="seclabel">By moment</div>';
  }

  GROUPS.forEach(function(g){
    var items = undated.filter(function(t){ return t.group === g.id; });
    var open = S.open === g.id && items.length;
    var count = items.length
      ? '<span class="gcount'+(g.id==='quick'?' hot':'')+'">'+items.length+'</span>'
      : '<span class="gcount clear">clear</span>';
    html += '<section class="group'+(open?' open':'')+(items.length?'':' empty')+'" data-g="'+g.id+'">'+
      '<button class="grow" type="button" data-toggle="'+g.id+'">'+
        '<span class="gicon">'+svg(g.id)+'</span>'+
        '<span class="gname">'+g.name+'</span>'+ count +
      '</button>'+
      (open ? '<div class="ghint">'+g.hint+'</div><div class="gtasks">'+
        items.map(function(t){ return taskHTML(t, false); }).join('')+'</div>' : '')+
    '</section>';
  });

  listEl.innerHTML = html;
}

/* ---------------- toast ---------------- */
var toastEl = document.getElementById('toast'), toastT;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, 1700);
}

/* ---------------- capture ---------------- */
var form = document.getElementById('capture');
var entry = document.getElementById('entry');
var addBtn = document.getElementById('add');

entry.addEventListener('input', function(){
  addBtn.classList.toggle('ready', entry.value.trim().length > 0);
});
form.addEventListener('submit', function(e){
  e.preventDefault();
  var g = add(entry.value);
  if (!g) return;
  entry.value = '';
  addBtn.classList.remove('ready');
  render();
  toast('-> ' + GMAP[g].name.toLowerCase());
});

/* ---------------- interactions ---------------- */
listEl.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  if (b.dataset.toggle){
    S.open = (S.open === b.dataset.toggle) ? null : b.dataset.toggle;
    save(); render(); return;
  }
  if (b.dataset.keep) { keep(b.dataset.keep); return; }
  if (b.dataset.kill) { remove(b.dataset.kill); return; }
  if (b.dataset.move) { move(b.dataset.move, b.dataset.g); return; }
});

/* swipe: right = done, left = open the tray */
var drag = null;
listEl.addEventListener('pointerdown', function(e){
  if (e.target.closest('button')) return;
  var surf = e.target.closest('.tsurface'); if (!surf) return;
  drag = { surf: surf, task: surf.closest('.task'), x: e.clientX, y: e.clientY, dx: 0, live: false };
});
listEl.addEventListener('pointermove', function(e){
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.live){
    if (Math.abs(dy) > Math.abs(dx)) { drag = null; return; }
    if (Math.abs(dx) < 8) return;
    drag.live = true;
    drag.task.classList.add('sliding');
    drag.surf.setPointerCapture && drag.surf.setPointerCapture(e.pointerId);
  }
  drag.dx = dx;
  drag.surf.style.transform = 'translateX(' + (dx * 0.62) + 'px)';
});
function endDrag(){
  if (!drag) return;
  var d = drag; drag = null;
  d.task.classList.remove('sliding');
  d.surf.style.transform = '';
  if (!d.live) { d.task.classList.toggle('tray'); return; }
  if (d.dx > 70) complete(d.task.dataset.id);
  else if (d.dx < -70) d.task.classList.add('tray');
}
listEl.addEventListener('pointerup', endDrag);
listEl.addEventListener('pointercancel', endDrag);

/* ---------------- backup ---------------- */
document.getElementById('export').addEventListener('click', function(){
  var text = JSON.stringify(S);
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast('backup copied'); },
                                             function(){ window.prompt('Copy this:', text); });
  } else { window.prompt('Copy this:', text); }
});
document.getElementById('import').addEventListener('click', function(){
  var text = window.prompt('Paste a backup:');
  if (!text) return;
  try{
    var p = JSON.parse(text);
    if (!p || !Array.isArray(p.tasks)) throw 0;
    Object.keys(S).forEach(function(k){ if (p[k] !== undefined) S[k] = p[k]; });
    save(); render(); toast('restored');
  }catch(e){ toast('that backup did not parse'); }
});

/* ---------------- offline ---------------- */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}

/* ---------------- go ---------------- */
load();
render();
window.addEventListener('pageshow', function(){
  if (S.doneDate !== shiftDays(0)) { S.doneToday = 0; S.doneDate = shiftDays(0); save(); }
  render();
});
</script>
</body>
</html>
